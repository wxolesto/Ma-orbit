<body>
<div id="app">
  <div class="field" aria-hidden="true"><i></i><i></i><i></i><u></u><u></u><u></u><u></u><u></u></div>
  <main class="wrap" id="view"></main>
  <div class="dock"><nav class="tabs glass" role="tablist"><i class="ind"></i><button role="tab" data-tab="home"></button><button role="tab" data-tab="stats"></button><button role="tab" data-tab="subs"></button></nav></div>
  <div id="sheetWrap" hidden><div class="scrim" id="scrim"></div><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
  <div id="toast" aria-live="polite"></div>
</div>
<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const dkey=d=>{d=d||new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const num=n=>'<bdi dir="ltr">'+n+'</bdi>';

/* ---------- Jalali ---------- */
function g2j(gy,gm,gd){
  const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy=gy<=1600?0:979;gy-=gy<=1600?621:1600;
  const gy2=gm>2?gy+1:gy;
  let days=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];
  jy+=33*Math.floor(days/12053);days%=12053;
  jy+=4*Math.floor(days/1461);days%=1461;
  if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}
  const jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);
  const jd=1+(days<186?days%31:(days-186)%30);
  return [jy,jm,jd];
}
function j2g(jy,jm,jd){
  jy+=1595;
  let days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+jd+(jm<7?(jm-1)*31:((jm-7)*30)+186);
  let gy=400*Math.floor(days/146097);days%=146097;
  if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}
  gy+=4*Math.floor(days/1461);days%=1461;
  if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}
  let gd=days+1;
  const sal=[0,31,((gy%4===0&&gy%100!==0)||gy%400===0)?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm=0;for(;gm<13;gm++){if(gd<=sal[gm])break;gd-=sal[gm]}
  return [gy,gm,gd];
}
const JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WD=['ی','د','س','چ','پ','ج','ش'];
function jlen(y,m){if(m<=6)return 31;if(m<=11)return 30;const g=j2g(y,12,30);const b=g2j(g[0],g[1],g[2]);return b[1]===12&&b[2]===30?30:29}
const jnow=()=>{const d=new Date();return g2j(d.getFullYear(),d.getMonth()+1,d.getDate())};

/* ---------- state ---------- */
const KEY='orbit.v1';
const COLORS=['#5bb8ff','#c8f03c','#ff8a7a','#ffc95c','#b79bff','#4de8c2','#ff7ad1','#8aa0ff'];
const DEF=()=>({subs:[],log:[],opts:{focus:25,short:5,long:15,every:4,goal:120,auto:false,snd:true,hap:true,wake:true,ntf:true},theme:'orbit',run:null,mode:'focus',sel:null,cyc:0,pend:null,seq:1});
let S=DEF();
try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j&&typeof j==='object'){S=Object.assign(DEF(),j);S.opts=Object.assign(DEF().opts,j.opts||{})}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const uid=()=>(S.seq++)+'_'+Date.now().toString(36);
const subOf=id=>S.subs.find(s=>s.id===id);

/* ---------- icons ---------- */
const IC={
 play:'<path d="M8 5.5v13l11-6.5z" fill="currentColor"/>',pause:'<path d="M8.5 5.5v13M15.5 5.5v13" stroke-width="3.4"/>',
 stop:'<rect x="6.5" y="6.5" width="11" height="11" rx="2.5" fill="currentColor"/>',skip:'<path d="M6 6.5l9 5.500-9 5.500zM18.500 6v12"/>',
 gear:'<circle cx="12" cy="12" r="3.200"/><path d="M12 3v2.200M12 18.800V21M3 12h2.200M18.800 12H21M5.600 5.600l1.600 1.600M16.800 16.800l1.600 1.600M18.400 5.600l-1.600 1.600M7.200 16.800l-1.600 1.600"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',timer:'<circle cx="12" cy="13.500" r="7"/><path d="M12 10v3.800l2.400 1.400M9.500 3.500h5"/>',
 chart:'<path d="M5 20V11M12 20V5M19 20v-6"/>',layers:'<path d="M12 4l8 4.500-8 4.500-8-4.500z"/><path d="M4 12.500l8 4.500 8-4.500M4 16.500l8 4.500 8-4.500"/>',
 flame:'<path d="M12 3c.5 3-2.500 4.600-2.500 7.700 0 1.200.6 2 1.400 2.500-.2-1.800 1-3 2.600-4.200 1.100 1.800 3 3.500 3 6.200A5 5 0 0 1 7 15.500c0-3 2-4.700 3-7C11 6 11.500 4.500 12 3z"/>',
 x:'<path d="M6.500 6.500l11 11M17.500 6.500l-11 11"/>',check:'<path d="M5 12.500l4.200 4.200L19 7"/>',trash:'<path d="M5 7h14M10 7V4.500h4V7M7 7l1 12.500h8L17 7"/>',
 chr:'<path d="M9 6l6 6-6 6"/>',chl:'<path d="M15 6l-6 6 6 6"/>',
 chd:'<path d="M6 9l6 6 6-6"/>',inf:'<path d="M12 12c-1.800-2.600-3.200-4-5-4a4 4 0 0 0 0 8c1.800 0 3.200-1.400 5-4zm0 0c1.800 2.600 3.200 4 5 4a4 4 0 0 0 0-8c-1.800 0-3.200 1.400-5 4z"/>'
};
const svg=(n,c)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'+(c?' class="'+c+'"':'')+'>'+IC[n]+'</svg>';

/* ---------- helpers ---------- */
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+p2(s%60)};
const hms=ms=>{const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600);return (h?h+':'+p2(Math.floor(s%3600/60)):Math.floor(s/60))+':'+p2(s%60)};
function durT(sec){sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);if(!h&&!m)return sec>0?'<1m':'0m';return h?h+'h '+m+'m':m+'m'}
const dur=sec=>num(durT(sec));
const clockT=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())};
function jlabel(k){const [y,m,d]=k.split('-').map(Number);const j=g2j(y,m,d);return num(j[2])+' '+JM[j[1]-1]+' '+num(j[0])}
function toast(m){const t=$('#toast');t.innerHTML='<div class="toast">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>t.innerHTML='',2600)}
let AC=null;
function beep(f,d,at){if(!S.opts.snd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+(at||0);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.05)}catch(e){}}
const buzz=p=>{if(S.opts.hap&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};
function chime(){beep(660,.35,0);beep(880,.35,.22);beep(1175,.6,.44);buzz([220,110,220,110,420])}

/* ---------- sheets ---------- */
let sheetOpen=false;
function openSheet(html,bind){
  $('#toast').innerHTML='';const w=$('#sheetWrap');let sh=$('#sheet');const n=sh.cloneNode(false);sh.replaceWith(n);sh=n;
  sh.className='sheet';sh.innerHTML='<div class="grab"><i></i></div>'+html;w.hidden=false;sheetOpen=true;if(bind)bind(sh);
}
function closeSheet(cb){
  const w=$('#sheetWrap'),sh=$('#sheet');if(w.hidden){cb&&cb();return}
  sheetOpen=false;sh.classList.add('closing');$('#scrim').classList.add('closing');
  setTimeout(()=>{w.hidden=true;$('#scrim').classList.remove('closing');sh.innerHTML='';sh.className='sheet';cb&&cb()},270);
}
$('#scrim').addEventListener('click',()=>{if(S.pend){S.pend=null;save()}closeSheet()});

/* ---------- logging & stats ---------- */
const closeSegs=(r,end)=>(r.segs||[[r.st,null]]).map(x=>[x[0],x[1]||end]);
function logSession(sub,sec,endT,k,st,ph,segs){
  const s=subOf(sub);const e={id:uid(),t:endT,dur:Math.round(sec),sub:sub||null,sn:s?s.name:'',sc:s?s.c:'',k:k,s:st||Math.round(endT-sec*1000),ph:ph||'',g:segs||null,note:''};
  S.log.push(e);return e;
}
function byDay(){const m={};for(const e of S.log){if(e.k==='b')continue;const k=dkey(new Date(e.t));m[k]=(m[k]||0)+e.dur}return m}
const dayKey=(off)=>{const d=new Date();d.setDate(d.getDate()-off);return dkey(d)};
function streak(){const by=byDay(),g=S.opts.goal*60;let d=new Date(),n=0;if((by[dkey(d)]||0)<g)d.setDate(d.getDate()-1);while((by[dkey(d)]||0)>=g&&n<4000){n++;d.setDate(d.getDate()-1)}return n}
const byBreak=()=>{const m={};for(const e of S.log){if(e.k!=='b')continue;const k=dkey(new Date(e.t));m[k]=(m[k]||0)+e.dur}return m};
const sname=e=>{if(e.k==='b')return e.ph==='long'?'استراحت بلند':'استراحت کوتاه';const s=subOf(e.sub);return s?s.name:(e.sn||'عمومی')};
const scol=e=>{if(e.k==='b')return '#7fd6c4';const s=subOf(e.sub);return s?s.c:(e.sc||'#8fa3c9')};

/* ---------- run engine ---------- */
const planned=ph=>(ph==='focus'?S.opts.focus:ph==='short'?S.opts.short:S.opts.long)*60000;
function elapsed(r,now){
  if(r.ph==='free')return r.acc+(r.paused?0:now-r.t0);
  return r.total-(r.paused?r.left:Math.max(0,r.endsAt-now));
}
function clock(now){
  const r=S.run;
  if(!r){if(S.mode==='free')return {txt:'0:00',fr:0};return {txt:mmss(planned(S.mode)),fr:0}}
  const e=elapsed(r,now);
  if(r.ph==='free')return {txt:hms(e),fr:(e%3600000)/3600000};
  return {txt:mmss(r.total-e),fr:Math.min(1,e/r.total)};
}
const LN=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
async function unsched(){const l=LN();if(!l)return;try{await l.cancel({notifications:[{id:7}]})}catch(e){}}
async function sched(){
  const l=LN();await unsched();const r=S.run;
  if(!l||!S.opts.ntf||!r||r.paused||r.ph==='free')return;
  try{
    let p=await l.checkPermissions();if(p.display!=='granted')p=await l.requestPermissions();if(p.display!=='granted')return;
    const f=r.ph==='focus';
    await l.schedule({notifications:[{id:7,title:f?'تمرکز تموم شد':'استراحت تموم شد',body:f?'وقت استراحته':'برگرد سر درس',schedule:{at:new Date(r.endsAt),allowWhileIdle:true}}]});
  }catch(e){}
}
let WL=null;
async function wake(){
  try{
    const need=S.run&&!S.run.paused&&S.opts.wake&&document.visibilityState==='visible'&&navigator.wakeLock;
    if(need){if(!WL){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}}
    else if(WL){const w=WL;WL=null;await w.release()}
  }catch(e){WL=null}
}
function startRun(){
  const ph=S.mode,now=Date.now();
  if(ph==='free')S.run={ph:'free',sub:S.sel,total:0,t0:now,acc:0,paused:false,st:now,segs:[[now,null]]};
  else{const t=planned(ph);S.run={ph,sub:S.sel,total:t,endsAt:now+t,left:t,paused:false,st:now,segs:[[now,null]]}}
  save();sched();wake();render(false);
}
function pauseRun(){
  const r=S.run,now=Date.now();if(!r||r.paused)return;
  if(r.ph==='free')r.acc+=now-r.t0;else r.left=Math.max(0,r.endsAt-now);
  r.paused=true;if(!r.segs)r.segs=[[r.st,null]];const ls=r.segs[r.segs.length-1];if(!ls[1])ls[1]=now;save();unsched();wake();render(false);
}
function resumeRun(){
  const r=S.run,now=Date.now();if(!r||!r.paused)return;
  if(r.ph==='free')r.t0=now;else r.endsAt=now+r.left;
  r.paused=false;if(!r.segs)r.segs=[[r.st,now]];r.segs.push([now,null]);save();sched();wake();render(false);
}
function completeRun(now){
  const r=S.run,late=now-r.endsAt;let ask=false;
  if(r.ph==='focus'){
    const e=logSession(r.sub,r.total/1000,r.endsAt,'f',r.st,'focus',closeSegs(r,r.endsAt));S.cyc++;S.mode=S.cyc%S.opts.every===0?'long':'short';S.pend=e.id;ask=true;
  }else{logSession(null,r.total/1000,r.endsAt,'b',r.st,r.ph,closeSegs(r,r.endsAt));S.mode='focus'}
  const wasFocus=r.ph==='focus';
  S.run=null;save();unsched();wake();
  if(late<10000)chime();
  toast(wasFocus?'تمرکز تموم شد':'استراحت تموم شد');
  if(S.opts.auto){startRun();if(ask)setTimeout(askNote,350);return}
  render(false);if(ask)askNote();
}
function endRun(keep){
  const r=S.run;if(!r)return;const now=Date.now();let e=null;
  if(r.ph==='focus'||r.ph==='free'){
    const sec=elapsed(r,now)/1000;
    if(keep&&sec>=60){e=logSession(r.sub,sec,now,r.ph==='free'?'r':'f',r.st,r.ph,closeSegs(r,now));S.pend=e.id}
  }else{const sec=elapsed(r,now)/1000;if(sec>=30)logSession(null,sec,now,'b',r.st,r.ph,closeSegs(r,now));S.mode='focus'}
  S.run=null;save();unsched();wake();render(false);
  if(e)askNote();else if(keep===false)toast('جلسه حذف شد');
}
function skipRun(){
  const r=S.run;if(!r)return;
  if(r.ph==='focus'){
    const now=Date.now(),sec=elapsed(r,now)/1000;let e=null;
    if(sec>=60){e=logSession(r.sub,sec,now,'f',r.st,'focus',closeSegs(r,now));S.pend=e.id}
    S.cyc++;S.mode=S.cyc%S.opts.every===0?'long':'short';
    S.run=null;save();unsched();wake();render(false);toast(sec>=60?'ثبت شد، برو استراحت':'رفتیم سراغ استراحت');
    if(e)setTimeout(askNote,300);
  }else endRun(false);
}
function mkWheel(root,min,max,val,tick){
  const list=$('.wl',root),n=max-min+1,H=44;
  let pos=Math.max(0,Math.min(n-1,val-min)),tgt=null,vel=0,drag=false,ly=0,lt=0,moved=0,raf=0,last=-1,lo=0,hi=-1,pt=0;
  list.innerHTML=Array.from({length:n},(_,i)=>'<div class="wi" data-i="'+i+'">'+(min+i)+'</div>').join('');
  const items=list.children,cl=p=>Math.max(0,Math.min(n-1,p));
  function paint(){
    list.style.transform='translate3d(0,'+(88-pos*H).toFixed(2)+'px,0)';
    const a=Math.max(0,Math.floor(pos)-4),b=Math.min(n-1,Math.ceil(pos)+4);
    for(let i=Math.min(lo,a);i<=Math.max(hi,b);i++){
      const el=items[i];if(!el)continue;
      if(i<a||i>b){el.style.opacity='';el.style.transform='';continue}
      const d=Math.abs(i-pos);el.style.opacity=Math.max(.1,1-d*.3).toFixed(2);el.style.transform='scale('+Math.max(.78,1.16-d*.14).toFixed(3)+')';
    }
    lo=a;hi=b;const v=Math.round(pos);if(v!==last){last=v;tick(min+v)}
  }
  function step(t){
    raf=0;const dt=Math.min(34,t-(pt||t));pt=t;
    if(!drag){
      if(Math.abs(vel)>.0005){pos=cl(pos+vel*dt);vel*=Math.pow(.993,dt);if(pos<=0||pos>=n-1)vel=0}
      else{vel=0;const T=tgt!==null?tgt:Math.round(pos);pos+=(T-pos)*Math.min(1,dt*.018);if(Math.abs(T-pos)<.003){pos=T;tgt=null;paint();pt=0;return}}
    }
    paint();raf=requestAnimationFrame(step);
  }
  const go=()=>{if(!raf){pt=0;raf=requestAnimationFrame(step)}};
  root.addEventListener('pointerdown',e=>{drag=true;vel=0;tgt=null;ly=e.clientY;lt=e.timeStamp;moved=0;try{root.setPointerCapture(e.pointerId)}catch(x){}go()});
  root.addEventListener('pointermove',e=>{if(!drag)return;const dy=e.clientY-ly,dt=e.timeStamp-lt;ly=e.clientY;lt=e.timeStamp;moved+=Math.abs(dy);pos=cl(pos-dy/H);if(dt>0)vel=.7*vel+.3*(-dy/H/dt)});
  const up=e=>{if(!drag)return;drag=false;if(moved<6){const it=e.target.closest&&e.target.closest('.wi');if(it){tgt=+it.dataset.i;vel=0}}go()};
  root.addEventListener('pointerup',up);root.addEventListener('pointercancel',up);
  root.addEventListener('wheel',e=>{e.preventDefault();tgt=cl(Math.round(pos)+(e.deltaY>0?1:-1));vel=0;go()},{passive:false});
  paint();
  return {get:()=>min+Math.round(tgt!==null?tgt:pos),goto:v=>{tgt=cl(v-min);vel=0;go()}};
}
function durSheet(){

function morph(a,b){
  if(a.classList&&a.classList.contains('pi'))return;
  for(const x of [...a.attributes])if(!b.hasAttribute(x.name))a.removeAttribute(x.name);
  for(const x of [...b.attributes])if(a.getAttribute(x.name)!==x.value)a.setAttribute(x.name,x.value);
  const ac=[...a.childNodes],bc=[...b.childNodes];
  if(ac.length!==bc.length||ac.some((n,i)=>n.nodeType!==bc[i].nodeType||(n.nodeType===1&&n.nodeName!==bc[i].nodeName))){
    const inSvg=!!a.closest('svg')||a.id==='tm';
    a.replaceChildren(...bc);if(!inSvg)for(const n of bc)if(n.nodeType===1)n.classList.add('soft');return;
  }
  ac.forEach((n,i)=>{if(n.nodeType===3){if(n.nodeValue!==bc[i].nodeValue)n.nodeValue=bc[i].nodeValue}else morph(n,bc[i])});
}
function render(anim){
  const v=$('#view');
  const html=tab==='home'?viewHome():tab==='stats'?viewStats():viewSubs();
  document.body.classList.toggle('run',!!S.run&&tab==='home');
  if(anim||lastTab!==tab||!v.children.length){
    v.className='wrap'+(anim?' in':'');v.innerHTML=html;
    if(anim)[...v.children].forEach((el,i)=>el.style.setProperty('--i',i));
  }else{
    const t=document.createElement('main');t.id='view';t.className=v.className;t.innerHTML=html;morph(v,t);
  }
  lastTab=tab;slideAll();
  $$('.tabs button').forEach(b=>{const t=TABS[b.dataset.tab];if(!b.firstChild)b.innerHTML=svg(t[1])+'<span>'+t[0]+'</span>';b.setAttribute('aria-selected',b.dataset.tab===tab)});
  requestAnimationFrame(()=>placeInd(false));
}
const THEMES=[['orbit','Orbit','#c8f03c','#0b1738'],['aurora','Aurora','#4de8c2','#07332c'],['dusk','Dusk','#ff8fb8','#2a1146'],['ember','Ember','#ffb340','#33160a'],['mono','Mono','#f2f2f2','#1b1b1e'],['cloud','Cloud','#2a6bff','#f7faff']];
function applyTheme(fade){
  const h=document.documentElement;if(fade){h.classList.add('tf');setTimeout(()=>h.classList.remove('tf'),450)}
  h.dataset.theme=S.theme||'orbit';
  try{const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(h).getPropertyValue('--bg').trim()}catch(e){}
}
applyTheme(false);

/* ---------- sheets: subject / note / stop / settings / day ---------- */
function subSheet(id){
  const s=id?subOf(id):null;let col=s?s.c:COLORS[S.subs.length%COLORS.length],armed=false;
  openSheet('<h2>'+(s?'ویرایش درس':'درس جدید')+'</h2><div class="frm"><input class="inp" id="sn" maxlength="24" placeholder="اسم درس" autocomplete="off" value="'+esc(s?s.name:'')+'"><div class="sw">'+COLORS.map(c=>'<button data-c="'+c+'" style="background:'+c+'" aria-pressed="'+(c===col)+'" aria-label="color"></button>').join('')+'</div><div class="acts"><button class="pill" id="ok">ذخیره</button>'+(s?'<button class="pill danger" id="dl">حذف</button>':'')+'</div></div>',r=>{
    $$('.sw button',r).forEach(b=>b.onclick=()=>{col=b.dataset.c;$$('.sw button',r).forEach(x=>x.setAttribute('aria-pressed',x===b))});
    $('#ok',r).onclick=()=>{const n=$('#sn',r).value.trim();if(!n){$('#sn',r).focus();return}
      if(s){s.name=n;s.c=col}else{const ns={id:uid(),name:n,c:col};S.subs.push(ns);if(!S.sel||!subOf(S.sel))S.sel=ns.id;else if(tab==='home')S.sel=ns.id}
      save();closeSheet();render(false)};
    if(s)$('#dl',r).onclick=function(){if(!armed){armed=true;this.classList.add('arm');this.textContent='مطمئنی؟ دوباره بزن';return}
      S.subs=S.subs.filter(x=>x.id!==s.id);if(S.sel===s.id)S.sel=null;if(S.run&&S.run.sub===s.id)S.run.sub=null;save();closeSheet();render(false)};
  });
}
function askNote(){
  const e=S.log.find(x=>x.id===S.pend);if(!e){S.pend=null;return}
  openSheet('<h2>جلسه ثبت شد</h2><p class="tip">'+dur(e.dur)+' · '+esc(sname(e))+'</p><div class="frm"><input class="inp" id="nt" maxlength="90" placeholder="چی خوندی؟ (اختیاری)" autocomplete="off"><div class="acts"><button class="pill" id="ns">ذخیره</button><button class="pill soft" id="nk">رد کردن</button></div></div>',r=>{
    const done=()=>{S.pend=null;save();closeSheet(()=>render(false))};
    $('#ns',r).onclick=()=>{e.note=$('#nt',r).value.trim().slice(0,90);done()};$('#nk',r).onclick=done;
  });
}
function stopSheet(){
  const r0=S.run;if(!r0)return;const free=r0.ph==='free',foc=r0.ph==='focus';
  if(!foc&&!free){endRun(false);return}
  const sec=elapsed(r0,Date.now())/1000;
  openSheet('<h2>'+(free?'پایان زمان آزاد؟':'تمرکز رو تموم کنم؟')+'</h2><p class="tip">تا الان '+dur(sec)+(sec<60?' — کمتر از ۱ دقیقه ذخیره نمی‌شه.':'')+'</p><div class="frm"><div class="acts"><button class="pill" id="k1">ادامه بده</button></div><div class="acts"><button class="pill soft" id="k2">ذخیره و پایان</button><button class="pill danger" id="k3">دور بریز</button></div>'+(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App?'<div class="acts"><button class="pill soft" id="k4">بستن برنامه (تایمر ادامه داره)</button></div>':'')+'</div>',r=>{
    $('#k1',r).onclick=()=>closeSheet();
    $('#k2',r).onclick=()=>closeSheet(()=>endRun(true));
    $('#k3',r).onclick=()=>closeSheet(()=>endRun(false));
    const k4=$('#k4',r);if(k4)k4.onclick=()=>{const A=window.Capacitor.Plugins.App;try{(A.minimizeApp||A.exitApp)()}catch(e){}closeSheet()};
  });
}
const LIM={focus:[1,600,5],short:[1,600,1],long:[1,600,5],every:[2,8,1],goal:[10,720,10]};
function cfgSheet(){
  const o=S.opts;
  const stp=(k,l)=>'<div class="set"><span>'+l+'</span><div class="stp"><button data-k="'+k+'" data-d="-1" aria-label="-">−</button><b id="v_'+k+'">'+(k==='every'?o[k]:o[k]+' min')+'</b><button data-k="'+k+'" data-d="1" aria-label="+">+</button></div></div>';
  const tg=(k,l,s)=>'<div class="set"><div>'+l+(s?'<small>'+s+'</small>':'')+'</div><button class="tog" data-t="'+k+'" aria-pressed="'+o[k]+'" aria-label="'+k+'"></button></div>';
  openSheet('<h2>تنظیمات</h2><div><div class="set" style="flex-direction:column;align-items:stretch;gap:10px"><span>تم</span><div class="sw">'+THEMES.map(t=>'<button data-th="'+t[0]+'" aria-label="'+t[1]+'" aria-pressed="'+((S.theme||'orbit')===t[0])+'" style="background:linear-gradient(135deg,'+t[3]+' 50%,'+t[2]+' 50%);border-color:'+(((S.theme||'orbit')===t[0])?'#fff':'var(--stroke)')+'"></button>').join('')+'</div></div>'+stp('focus','تمرکز')+stp('short','استراحت کوتاه')+stp('long','استراحت بلند')+stp('every','بعد از چند دور، استراحت بلند')+stp('goal','هدف روزانه')
    +tg('auto','شروع خودکار مرحله‌ی بعد')+tg('snd','صدا')+tg('hap','لرزش')+tg('wake','روشن ماندن صفحه','وقتی تایمر در حال اجراست')+tg('ntf','اعلان پایان','وقتی برنامه بسته یا در پس‌زمینه است')
    +'<div class="set"><span class="muted">پاک کردن همه‌ی داده‌ها</span><button class="pill danger" id="rs" style="height:40px;padding-inline:16px;font-size:14px">پاک کن</button></div></div>',r=>{
    $$('[data-th]',r).forEach(b=>b.onclick=()=>{S.theme=b.dataset.th;save();applyTheme(true);$$('[data-th]',r).forEach(x=>{const on=x===b;x.setAttribute('aria-pressed',on);x.style.borderColor=on?'#fff':'var(--stroke)'})});
    $$('.stp button',r).forEach(b=>b.onclick=()=>{const k=b.dataset.k,l=LIM[k];o[k]=Math.min(l[1],Math.max(l[0],o[k]+l[2]*(+b.dataset.d)));$('#v_'+k,r).textContent=k==='every'?o[k]:o[k]+' min';save();if(!S.run)S.mode===S.mode;});
    $$('.tog',r).forEach(b=>b.onclick=()=>{const k=b.dataset.t;o[k]=!o[k];b.setAttribute('aria-pressed',o[k]);save();if(k==='wake')wake();if(k==='ntf'){if(o[k])sched();else unsched()}});
    let armed=false;$('#rs',r).onclick=function(){if(!armed){armed=true;this.classList.add('arm');this.textContent='مطمئنی؟';return}
      S=DEF();save();unsched();wake();applyTheme(true);closeSheet(()=>{render(true)})};
    const sw=$('#scrim');
  });
}
function daySheet(k){
  const es=S.log.filter(e=>dkey(new Date(e.t))===k).sort((a,b)=>a.t-b.t),tot=es.filter(e=>e.k!=='b').reduce((a,e)=>a+e.dur,0),btot=es.filter(e=>e.k==='b').reduce((a,e)=>a+e.dur,0);
  openSheet('<h2>'+jlabel(k)+'</h2><p class="tip">'+(es.length?'تمرکز: '+dur(tot)+' · استراحت: '+dur(btot):'جلسه‌ای ثبت نشده.')+'</p><div>'+es.map(e=>'<div class="srow"><i class="dot" style="background:'+scol(e)+';color:'+scol(e)+'"></i><div><b>'+esc(sname(e))+(e.k==='r'?' · آزاد':'')+'</b><small>'+num(clockT(e.s||e.t-e.dur*1000)+' – '+clockT(e.t))+(e.note?' · '+esc(e.note):'')+'</small>'+(e.g&&e.g.length>1?'<small>'+e.g.map(x=>num(clockT(x[0])+' – '+clockT(x[1]))).join(' · ')+'</small>':'')+'</div><span>'+dur(e.dur)+'</span><button class="rbtn" data-del="'+e.id+'" aria-label="delete">'+svg('trash')+'</button></div>').join('')+'</div>',r=>{
    $$('[data-del]',r).forEach(b=>b.onclick=()=>{if(!b.classList.contains('arm')){b.classList.add('arm');b.innerHTML='حذف؟';return}
      S.log=S.log.filter(x=>x.id!==b.dataset.del);save();closeSheet(()=>render(false))});
  });
}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-tab],[data-a],[data-sub],[data-mode],[data-rng],[data-day],[data-cm],[data-edit]');if(!t)return;
  if(sheetOpen&&!t.closest('#sheet')&&!t.closest('.tabs'))return;
  const d=t.dataset;
  if(d.tab){if(S.run&&false)return;if(tab!==d.tab){tab=d.tab;render(true);placeInd(true)}return}
  if(d.sub){S.sel=d.sub;save();render(false);return}
  if(d.mode){S.mode=d.mode;save();render(false);return}
  if(d.rng){rng=d.rng;render(false);return}
  if(d.day){daySheet(d.day);return}
  if(d.cm){cm=[cm[0],cm[1]+(+d.cm)];if(cm[1]>12){cm=[cm[0]+1,1]}if(cm[1]<1){cm=[cm[0]-1,12]}render(false);return}
  if(d.edit){subSheet(d.edit);return}
  switch(d.a){
    case'start':startRun();break;case'pause':pauseRun();break;case'resume':resumeRun();break;
    case'stop':stopSheet();break;case'skip':skipRun();break;case'dur':durSheet();break;
    case'cfg':cfgSheet();break;case'addsub':subSheet(null);break;
  }
});
(function(){
  const A=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;if(!A||!A.addListener)return;
  A.addListener('backButton',()=>{
    if(!$('#sheetWrap').hidden){if(S.pend){S.pend=null;save()}closeSheet();return}
    if(S.run&&tab==='home'){stopSheet();return}
    if(tab!=='home'){tab='home';render(true);placeInd(true);return}
    if(A.exitApp)A.exitApp();
  });
})();
render(true);
// resume a running timer / finished while away
if(S.run){tick();wake()}
if(S.pend&&!sheetOpen)askNote();
})();
